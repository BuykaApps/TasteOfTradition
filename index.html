<style>

@keyframes fl{to{transform:translate(6vw,5vh) scale(1.18)}}

.top h1{margin:0;font-size:18px}.top h1 small{color:var(--m);font-weight:400;font-size:12px;margin-left:8px}.sp{flex:1}#burger{display:none}

.rp{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rp .55s linear;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
main{padding:18px 22px 40px;max-width:1320px;margin:auto}
section{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}

.kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.15s}.kpi:nth-child(5){animation-delay:.2s}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}

tbody tr{transition:background .15s,transform .15s}tbody tr:nth-child(even){background:#8aa0b30f}tbody tr:hover{background:color-mix(in srgb,var(--a) 16%,transparent)}
td.n,th.n{text-align:right}.sc{overflow:auto;max-height:68vh;border-radius:10px}.bm table{table-layout:fixed;width:1040px}.bm td,.bm th{overflow:hidden;text-overflow:ellipsis}
.z{opacity:.5}.p{background:#1e84491a}.p td{font-weight:600}.sub{color:var(--m);font-size:12px}
a.l{color:var(--a);cursor:pointer;font-weight:600;border-bottom:1px dashed var(--a);transition:.15s}a.l:hover{background:color-mix(in srgb,var(--a) 18%,transparent);border-bottom-style:solid}
.bar{height:12px;background:var(--b);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a) 50%,#fff));border-radius:6px;animation:gw .8s ease both;transform-origin:left}@keyframes gw{from{transform:scaleX(0)}}
.hb{display:grid;grid-template-columns:130px 1fr 100px;gap:8px;align-items:center;margin:4px -6px;padding:4px 6px;border-radius:8px;font-size:13px;transition:background .15s,transform .15s}.hb:hover{background:color-mix(in srgb,var(--a) 12%,transparent);transform:translateX(3px)}.hb u{text-decoration:none;text-align:right;color:var(--m)}
.chip{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;background:#8aa0b322;display:inline-block;transition:transform .15s}a.l:hover .chip{transform:scale(1.08)}.chip.w{background:#c0392b24;color:var(--r)}.chip.y{background:#d6891024;color:var(--y)}.chip.ok{background:#1e844924;color:var(--g)}
label{display:block;margin:10px 0 4px;color:var(--m);font-size:12px}input,select{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:10px;background:var(--cd);color:var(--t);font:inherit;transition:border-color .15s,box-shadow .15s}

.f{max-width:480px}.w{color:var(--r);font-weight:600}.ok{color:var(--g)}
dialog{border:1px solid var(--b);border-radius:16px;background:var(--cd);backdrop-filter:blur(22px);color:var(--t);max-width:880px;width:94%;box-shadow:0 24px 70px #0007;padding:20px;animation:pp .22s}

.pop{position:absolute;right:22px;top:58px;width:270px;background:var(--cd);backdrop-filter:blur(20px);border:1px solid var(--b);border-radius:14px;padding:14px;box-shadow:0 18px 50px #0006;animation:pp .18s}.pop[hidden]{display:none}

#cdlg{border:1px solid var(--b);border-radius:16px;background:var(--cd);backdrop-filter:blur(22px);color:var(--t);max-width:440px;width:92%;box-shadow:0 24px 70px #0008;padding:22px;animation:pp .2s}#cdlg::backdrop{background:#030a1288;backdrop-filter:blur(5px)}
.cmb{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

.ng.open>.ngh .chv{transform:rotate(90deg)}.ng.open>.ngh{color:#fff}.gi{display:none;flex-direction:column;gap:2px;margin:2px 0 8px 20px;padding-left:8px;border-left:1px solid #ffffff24}.ng.open>.gi{display:flex}
aside nav .gi button{padding:9px 12px;font-size:13.5px}
body.col .ngh{display:none}body.col .gi{display:flex!important;margin:0;padding:0;border:0}

#bdg{position:absolute;top:1px;right:1px;background:var(--r);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;min-width:16px;line-height:16px}#bdg:empty{display:none}
#bell{width:340px;right:60px}.bi{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .15s}.bi:hover{background:color-mix(in srgb,var(--a) 14%,transparent)}
#fab{position:fixed;right:24px;bottom:24px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}

#kp{border:1px solid var(--b);border-radius:16px;background:var(--cd);backdrop-filter:blur(22px);color:var(--t);width:92%;max-width:620px;margin:12vh auto auto;padding:12px;box-shadow:0 24px 70px #0008;animation:pp .15s}#kp::backdrop{background:#030a1288;backdrop-filter:blur(5px)}
#kq{font-size:16px;padding:12px 14px}#kl{max-height:52vh;overflow:auto;margin-top:8px}#kl .ki{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer}

.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.lg div{display:flex;gap:8px;align-items:center;margin:5px 0;cursor:pointer}.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}.lg div:hover{color:var(--a)}

 #bt button{flex:1;background:none;border:0;color:var(--m);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;cursor:pointer}#bt button span{font-size:20px}#bt button.on{color:var(--a);font-weight:700}
 main{padding-bottom:90px}#fab{bottom:82px;right:14px}#bell{right:10px;width:calc(100vw - 20px)}.kbd{display:none}}

<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbzM7EBTzUZ1o2qtZmTvbsUN3u0LCjJ3C27sqEnI10khoMUEdH6avvFSiPsvPZd8Mb2jcw/exec';
const $=s=>document.querySelector(s),LS=localStorage,fmt=n=>(+n||0).toLocaleString('en',{maximumFractionDigits:2}),T=n=>fmt(Math.round(n))+' ₮';
const today=new Date(),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),pad=n=>String(n).padStart(2,'0');
const ym=(y,m)=>y+'-'+pad(m);
$('#d1').value=ym(today.getFullYear(),today.getMonth()+1)+'-01';$('#d2').value=iso(new Date(today.getFullYear(),today.getMonth()+1,0)).slice(0,10);
const mm=today.getFullYear()+'-'+pad(today.getMonth()+1);
const DEMO={purchases:[],sales:[[mm+'-03','Аарц крем','Бурэлт',3,3000],[mm+'-04','Аарцтай боов','Нарын боов',27,0],[mm+'-17','Аарц крем','Бурэлт',3,3000]],
recipes:[['Аарц крем','Аарц',333.33,'гр'],['Аарцтай боов','Аарц','','гр'],['Аарцтай боов','Гурил',42.3,'гр']],stock:[['Аарц','гр',8500,1000],['Гурил','гр',20000,5000]],costs:[],expenses:[]};
let D=JSON.parse(LS.bmData||'null')||DEMO,URL_=WEB_APP_URL||'';
const day=v=>String(v).slice(0,10),k=s=>String(s).trim();
const inR=d=>day(d)>=$('#d1').value&&day(d)<=$('#d2').value;
const OPD=()=>[...document.querySelectorAll('dialog[open]')].pop()||document.body;
const toast=t=>{const m=$('#msg');OPD().appendChild(m);m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)};
async function load(){
 if(!URL_){$('#src').textContent='Туршилтын горим';return render()}
 try{const j=await (await fetch(URL_)).json();if(j.error){alert(j.error);return render()}D=j;LS.bmData=JSON.stringify(D);$('#src').textContent='✅ Google Sheets'}
 catch(e){toast('Sheets-тэй холбогдож чадсангүй')}
 render()}
async function save(sheet,row){
 (D[sheet]=D[sheet]||[]).push(row);LS.bmData=JSON.stringify(D);
 if(URL_)try{
  toast('Илгээж байна...');
  const j=await (await fetch(URL_+'?d='+encodeURIComponent(JSON.stringify({sheet,row})))).json();
  if(j.ok)toast('Sheets-д хадгаллаа ✅');
  else{console.error(j);alert('Sheets алдаа: '+(j.error||JSON.stringify(j)));toast('Sheets алдаа: '+(j.error||'?'))}
 }catch(e){console.error(e);toast('Sheets-тэй холбогдож чадсангүй — Apps Script-ийг New version-оор Deploy хийсэн үү?')}
 else toast('Хадгаллаа (туршилтын горим)');render()}
// ---- БМ тайлан тооцоо
function rows(ing,f=inR){const rec={};D.recipes.forEach(r=>{if(k(r[1])==k(ing))rec[k(r[0])]=(rec[k(r[0])]||0)+(+r[2]||0)});
 return D.sales.filter(s=>f(s[0])&&k(s[1])in rec).map(s=>({d:day(s[0]),p:s[1],q:+s[3]||0,a:rec[k(s[1])],e:(+s[3]||0)*rec[k(s[1])]}))}
const ins=(ing,f=inR)=>D.purchases.filter(p=>f(p[0])&&k(p[1])==k(ing));
function bm(){const d1=$('#d1').value,ms=d1.slice(0,7)+'-01',pre=d=>day(d)>=ms&&day(d)<d1;return D.stock.map(s=>{const i0=ins(s[0],pre).reduce((a,p)=>a+(+p[2]||0),0)+adj(s[0],pre,1),o0=rows(s[0],pre).reduce((a,r)=>a+r.e,0)+adj(s[0],pre,0)+mvq(s[0],pre),op=(+s[2]||0)+i0-o0,i=ins(s[0]).reduce((a,p)=>a+(+p[2]||0),0)+adj(s[0],inR,1),o=rows(s[0]).reduce((a,r)=>a+r.e,0)+adj(s[0],inR,0)+mvq(s[0],inR),c=op+i-o,mn=+s[3]||0;
 const st=c<=0?['Дуссан','w']:c<=mn?['Доод хязгаараас доош','w']:c<=mn*1.3?['Анхааруулга','y']:['Хангалттай','ok'];
 return{n:s[0],u:s[1],open:op,i,o,c,mn,st}})}
// ---- Dashboard тооцоо (Excel-ийн Дашбоард-тай ижил)
const sel={y:today.getFullYear(),m:today.getMonth()+1};
function mon(y,m){const key=ym(y,m),cm={};(D.costs||[]).forEach(c=>cm[k(c[0])]=+c[1]||0);
 const S=D.sales.filter(s=>day(s[0]).slice(0,7)==key);
 const rev=S.reduce((a,s)=>a+(+s[4]||0),0),cost=S.reduce((a,s)=>a+(+s[3]||0)*(cm[k(s[1])]||0),0);
 const exp=(D.expenses||[]).filter(e=>day(e[0]).slice(0,7)==key).reduce((a,e)=>a+(+e[2]||0),0);
 const buy=D.purchases.filter(p=>day(p[0]).slice(0,7)==key).reduce((a,p)=>a+(+p[2]||0)*(+p[4]||0),0);
 return{S,rev,cost,exp,buy,net:rev-cost-exp}}
function lineChart(a,b){const W=420,H=200,P=34,all=[...a,...b],mx=Math.max(...all,1),mn=Math.min(...all,0),X=i=>P+i*(W-P-8)/11,Y=v=>H-24-(v-mn)/(mx-mn||1)*(H-44);
 const pl=(d,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${d.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+d.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${c}"/>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${P}" x2="${W-8}" y1="${Y(0)}" y2="${Y(0)}" stroke="#8aa0b366"/>`+
 [0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<text x="2" y="${Y(v)+3}">${fmt(v/1e6)}M</text>`}).join('')+pl(a,'#1f6f8b')+pl(b,'#0f2a43')+
 [...Array(12)].map((_,i)=>`<text x="${X(i)-4}" y="${H-8}">${i+1}</text>`).join('')+
 `<rect x="${W-130}" y="2" width="9" height="9" fill="#1f6f8b"/><text x="${W-118}" y="10">Орлого</text><rect x="${W-70}" y="2" width="9" height="9" fill="#0f2a43"/><text x="${W-58}" y="10">Цэвэр ашиг</text></svg>`}
const MN=['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар','7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];
const mm2=(y,m)=>Object.assign(mon(y,m),{d:new Date(y,m,0).getDate()}),PAL=['#1f6f8b','#7c3aed','#ea580c','#16a34a','#db2777','#2563eb','#ca8a04','#0891b2'];
function spark(a,c,s){const W=200,H=34,mx=Math.max(...a,1),mn=Math.min(...a,0),X=i=>i*(W/(a.length-1||1)),Y=v=>H-3-(v-mn)/(mx-mn||1)*(H-8),p=a.map((v,i)=>X(i)+','+Y(v)).join(' ');
 return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polygon points="0,${H} ${p} ${W},${H}" fill="${c}" opacity=".14"/><polyline points="${p}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${X(s)}" cy="${Y(a[s])}" r="3" fill="${c}"/></svg>`}
const dlt=(c,p,bd)=>{if(!p)return '<div class="dl"></div>';const d=(c-p)/Math.abs(p)*100,up=d>=0;return `<div class="dl ${(bd?!up:up)?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(d).toFixed(1)}% өмнөх сараас</div>`};
const MT=[['💰 НИЙТ ОРЛОГО',x=>x.rev,T,'#1f6f8b','rev',0],['🍽 ХООЛНЫ ӨРТӨГ (онол)',x=>x.cost,T,'#1e8449','cost',1],['💸 ҮЙЛ АЖИЛЛАГААНЫ ЗАРДАЛ',x=>x.exp,T,'#c0392b','exp',1],['💎 ЦЭВЭР АШИГ',x=>x.net,T,'#0f2a43','net',0],
 ['🔢 ХООЛНЫ ӨРТГИЙН ХУВЬ',x=>x.rev?x.cost/x.rev*100:0,v=>v.toFixed(1)+'%','#1e8449','cost',1],['📈 НИЙЛСЭН АШИГ (GP)',x=>x.rev-x.cost,T,'#1f6f8b','gp',0],['📦 АВАЛТ VS ОНОЛ ӨРТӨГ %',x=>x.cost?x.buy/x.cost*100:0,v=>v.toFixed(1)+'%','#d68910','buy',1],['🛒 БОРЛУУЛАЛТЫН МӨР ТОО',x=>x.S.length,fmt,'#117a8b','rev',0],['📅 ӨДРИЙН ДУНДАЖ ОРЛОГО',x=>x.rev/x.d,T,'#0f2a43','avg',0]];
function donut(cr,tot){const R=52,C=2*Math.PI*R;let off=0;return `<svg viewBox="0 0 140 140" width="150" height="150">`+cr.map(([n,o],i)=>{const f=tot?o.r/tot:0,len=f*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${PAL[i%8]}" stroke-width="24" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" style="cursor:pointer" onclick="kd('cat',${i})"><title>${esc(n)}: ${T(o.r)} (${(f*100).toFixed(1)}%)</title></circle>`;off+=len;return s}).join('')+`<text x="70" y="66" text-anchor="middle" style="font-size:9px">Нийт</text><text x="70" y="82" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--t)">${fmt(tot/1e6)}M</text></svg>`}
function heat(){const Y=sel.y,Mo=sel.m,n=new Date(Y,Mo,0).getDate(),dv={};LM.S.forEach(s=>{const d=day(s[0]);dv[d]=(dv[d]||0)+(+s[4]||0)});const mx=Math.max(...Object.values(dv),1),off=(new Date(Y,Mo-1,1).getDay()+6)%7;
 let q=['Да','Мя','Лх','Пү','Ба','Бя','Ня'].map(x=>`<small class="sub" style="text-align:center">${x}</small>`).join('')+'<div style="visibility:hidden"></div>'.repeat(off);
 for(let d=1;d<=n;d++){const ds=ym(Y,Mo)+'-'+pad(d),v=dv[ds]||0,a=v?.15+.85*v/mx:0;q+=`<div title="${ds}: ${T(v)}" onclick="hmGo('${ds}')" style="background:${v?`color-mix(in srgb,var(--a) ${Math.round(a*100)}%,transparent)`:'#8aa0b31a'};${a>.55?'color:#fff':''}">${d}</div>`}
 return `<div class="hm">${q}</div>`}
window.hmGo=d=>{cs.d1=cs.d2=d;dayR();go('day')};
function fcast(){const a=new Date(Date.now()-29*864e5).toLocaleDateString('sv'),b=tl(),f=d=>day(d)>=a&&day(d)<=b;
 return bm().map((x,i)=>{const u=(rows(x.n,f).reduce((s,r)=>s+r.e,0)+adj(x.n,f,0)+mvq(x.n,f))/30;return{i,n:x.n,u:x.u,c:x.c,avg:u,days:u>0?Math.max(0,x.c/u):null}}).filter(x=>x.avg>0)}
function fcHTML(n){const F=fcast().sort((x,y)=>x.days-y.days).slice(0,n);return (F.map(x=>{const c=x.days<3?'#c0392b':x.days<7?'#d68910':'#1e8449';return `<div class="fc" onclick="go('bm');dr(${x.i},'sum')" title="Өдрийн дундаж зарлага (сүүлийн 30 өдөр): ${fmt(x.avg)} ${x.u}"><span>${esc(x.n)}</span><div class="bar"><i style="width:${Math.min(100,x.days/14*100)}%;background:${c}"></i></div><u style="color:${c}">${x.days<1?'<1':Math.round(x.days)} өдөр</u></div>`}).join('')||'<p class="sub">Сүүлийн 30 өдөрт зарлагатай орц алга</p>')+'<p class="sub" style="margin:8px 0 0">Үлдэгдэл ÷ сүүлийн 30 хоногийн өдрийн дундаж зарлага. Үлдэгдэл нь БМ тайлангийн хугацааны төгсгөл байдлаар.</p>'}
function dash(){const M=mm2(sel.y,sel.m),B=bm(),ys=[...Array(12)].map((_,i)=>mm2(sel.y,i+1)),PM=mm2(sel.m==1?sel.y-1:sel.y,sel.m==1?12:sel.m-1),pc=(a,b)=>b?(a/b*100).toFixed(1)+'%':'0.0%',cat={};
 M.S.forEach(s=>{const c=k(s[2])||'Бусад';(cat[c]=cat[c]||{r:0,q:0});cat[c].r+=+s[4]||0;cat[c].q+=+s[3]||0});
 const cr=Object.entries(cat).sort((a,b)=>b[1].r-a[1].r);LM=M;LC=cr.map(c=>c[0]);
 const low=B.filter(b=>b.st[1]=='w'),bad=new Set();D.recipes.forEach(r=>{if(!+r[2])bad.add(k(r[0])+' → '+k(r[1]))});
 const K=([l,f,fm,c,n,bd])=>`<div class="kpi" style="--k:${c};cursor:pointer" onclick="kd('${n}')" title="Дарж задлах"><span>${l}</span><b>${fm(f(M))}</b>${dlt(f(M),f(PM),bd)}${spark(ys.map(f),c,sel.m-1)}</div>`;
 const yo=[...Array(5)].map((_,i)=>sel.y-2+i+1).filter(y=>y<=today.getFullYear()+1);
 $('#p-dash').innerHTML=`<div class="card tool" style="background:linear-gradient(120deg,var(--p),#1f4f73);color:#fff"><b>📅 ЖИЛ & САР СОНГОХ →</b>
 <select id="sy" style="max-width:100px">${yo.map(y=>`<option ${y==sel.y?'selected':''}>${y}</option>`).join('')}</select>
 <select id="sm" style="max-width:130px">${MN.map((n,i)=>`<option value="${i+1}" ${i+1==sel.m?'selected':''}>${n}</option>`).join('')}</select>
 <span class="sp"></span><b style="color:#f3c969;font-size:16px">${MN[sel.m-1]} ${sel.y} он</b></div>
 <div class="kpis">${MT.slice(0,4).map(K).join('')}</div><div class="kpis">${MT.slice(4).map(K).join('')}</div>
 <div class="bento">
 <div class="card s4"><h3>Ангиллын эзлэх хувь</h3><div class="donut">${cr.length?donut(cr,M.rev):''}<div class="lg">${cr.map(([n,o],i)=>`<div onclick="kd('cat',${i})"><i style="background:${PAL[i%8]}"></i>${esc(n)} <span class="sub">${pc(o.r,M.rev)}</span></div>`).join('')||'<p class="sub">Өгөгдөл алга</p>'}</div></div></div>
 <div class="card s8"><h3>Сарын орлого & ашиг — ${sel.y}</h3>${lineChart(ys.map(x=>x.rev),ys.map(x=>x.net))}</div>
 <div class="card s5"><h3>📅 Өдрийн орлого — календарь</h3>${heat()}<p class="sub" style="margin:8px 0 0">Өдөр дээр дарвал тухайн өдрийн тайлан нээгдэнэ</p></div>
 <div class="card s7"><h3>⏳ Нөөц хэдэн өдөрт хүрэх вэ</h3>${fcHTML(8)}</div>
 <div class="card s7"><h3>Ангиллаар орлого (хүснэгт)</h3><table><thead><tr><th>Ангилал</th><th class="n">Орлого</th><th class="n">Хувь</th><th class="n">Борлуулсан тоо</th></tr></thead><tbody>
 ${cr.map((c,i)=>`<tr style="cursor:pointer" onclick="kd('cat',${i})"><td>${esc(c[0])}</td><td class="n">${T(c[1].r)}</td><td class="n">${pc(c[1].r,M.rev)}</td><td class="n">${fmt(c[1].q)}</td></tr>`).join('')||'<tr><td colspan="4">Өгөгдөл алга</td></tr>'}</tbody></table></div>
 <div class="card s5"><h3>📦 Анхаарах орцууд</h3><table><tbody>${low.slice(0,12).map(b=>`<tr style="cursor:pointer" onclick="dr(${B.indexOf(b)},'sum')"><td>${esc(b.n)}</td><td class="n">${fmt(b.c)} ${b.u}</td><td><span class="chip w">${b.st[0]}</span></td></tr>`).join('')||'<tr><td class="ok">Бүгд хэвийн ✅</td></tr>'}</tbody></table>
 ${bad.size?`<p class="w">⚠ Жорд хэмжээ хоосон (${bad.size}): ${[...bad].slice(0,6).join(', ')}${bad.size>6?' …':''}</p>`:''}</div></div>`;
 $('#sy').onchange=e=>{sel.y=+e.target.value;dash()};$('#sm').onchange=e=>{sel.m=+e.target.value;dash()}}
// ---- харагдац
const TABS=[['dash','📊','Dashboard'],['docs','🧾','Баримт'],['bm','📋','БМ тайлан'],['warn','🚨','Анхааруулга'],['cnt','🧮','Тооллого'],['day','🗓','Өдрийн тайлан'],['pr','🏆','Бүтээгдэхүүн тайлан'],['yr','📈','Ашиг алдагдал'],['rec','🍽','Жор меню'],['buy','📥','Худалдан авалт'],['stock','📦','Түүхий эд / Орц үнэ'],['exp','💸','Зардал'],['set','💳','Тооцоо'],['sale','🧾','Борлуулалт'],['mv','🔁','Хөдөлгөөн'],['prod','🍰','Бүтээгдэхүүн'],['org','🏢','Байгууллага']];
const GR=[['rep','📑','Тайлан',['bm','day','pr','yr','warn']],['ref','📚','Лавлах',['rec','stock','prod']],['cfg','⚙️','Тохиргоо',['org']]],NO=JSON.parse(LS.navOpen||'{}'),tb=id=>TABS.find(x=>x[0]==id);
const nb=t=>`<button data-t="${t[0]}" title="${t[2]}"><span class="ic">${t[1]}</span><span class="lb">${t[2]}</span></button>`;
$('#nav').innerHTML=nb(tb('dash'))+nb(tb('docs'))+GR.map(g=>`<div class="ng${NO[g[0]]?' open':''}" data-g="${g[0]}"><button class="ngh" data-g="${g[0]}"><span class="ic">${g[1]}</span><span class="lb">${g[2]}</span><span class="chv">›</span></button><div class="gi">${g[3].map(id=>nb(tb(id))).join('')}</div></div>`).join('');
function go(t){TABS.forEach(x=>$('#p-'+x[0]).hidden=x[0]!=t);$('#nav').querySelectorAll('button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));document.querySelectorAll('#bt button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));{const g=GR.find(x=>x[3].includes(t));if(g){NO[g[0]]=1;LS.navOpen=JSON.stringify(NO);$('#nav').querySelector('.ng[data-g="'+g[0]+'"]').classList.add('open')}}
 const x=TABS.find(y=>y[0]==t);$('#ttl').innerHTML=x[1]+' '+x[2]+'<small>Taste of Tradition Mongolia</small>';LS.bmTab2=t;document.body.classList.remove('open')}

// ===== v2: бүртгэл (нэмэх/засах/устгах) + тайлангууд
const tl=()=>new Date().toLocaleDateString('sv'),cs={},RAW=()=>D.raw||{},nm=(a,i)=>[...new Set((a||[]).map(r=>k(r[i])))].filter(Boolean);
const DB={rec:['recipes','Жор меню',[['Бүтээгдэхүүн','pr'],['Орц','ing'],['Хэмжээ','number']]],
 buy:['purchases','Худалдан авалт',[['Огноо','date'],['Орц','ing'],['Тоо','number'],['Нэгж үнэ','number'],['Нийлүүлэгч','text'],['Тэмдэглэл','text']]],
 stock:['stock','Түүхий эд / Орц үнэ',[['Орц','text'],['Нэгж','text'],['Нэгж өртөг','number'],['Эхний үлдэгдэл','number'],['Доод хязгаар','number']]],
 exp:['expenses','Зардал',[['Огноо','date'],['Ангилал','cat'],['Тоо','number'],['Дүн','number'],['Тэмдэглэл','text']]],
 set:['settle','Тооцоо (авлага/өглөг)',[['Огноо','date'],['Харилцагч','text'],['Төрөл','text'],['Тайлбар','text'],['Авлага','number'],['Өглөг','number'],['Дуусах','date'],['Барагдуулалт','number']]],
