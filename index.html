<script>
// ===== Хадгалах үед бүх дэлгэцийг хаасан "Хадгалж байна" цонх (давхар дарахаас сэргийлнэ)
let _bz=null;
function busyOn(t,tot){if(!_bz){_bz=document.createElement('dialog');_bz.id='bz';_bz.innerHTML='<div class="bzs"></div><b class="bzt"></b><div class="bzb"><i></i></div><small class="bzn"></small>';_bz.addEventListener('cancel',e=>e.preventDefault());document.body.appendChild(_bz)}
 busyUp(t,0,tot);if(!_bz.open)_bz.showModal()}
function busyUp(t,i,tot){if(!_bz)return;_bz.querySelector('.bzt').textContent=t;const b=_bz.querySelector('.bzb');b.classList.toggle('ind',!tot);b.firstChild.style.width=tot?Math.round(i/tot*100)+'%':'';_bz.querySelector('.bzn').textContent=tot?i+' / '+tot:'Түр хүлээнэ үү...'}
function busyOff(){if(!_bz)return;const m=document.getElementById('msg');if(m&&_bz.contains(m))document.body.appendChild(m);if(_bz.open)_bz.close()}
window.addEventListener('beforeunload',e=>{if(BUSY){e.preventDefault();e.returnValue=''}});
async function api(d){if(!URL_){toast('Холболт тохируулаагүй');return false}
 if(BUSY){toast('Өмнөх үйлдэл дуусаагүй байна, түр хүлээнэ үү...');return false}BUSY=true;busyOn('Хадгалж байна...',0);
 try{const j=await call('act',d);if(j.ok){busyUp('Мэдээллийг шинэчилж байна...',0,0);await load();BUSY=false;busyOff();toast('Хадгаллаа ✅');return true}busyOff();alert('Алдаа: '+j.error)}catch(e){busyOff();toast('Холбогдож чадсангүй')}BUSY=false;busyOff();return false}
async function bulk(A){if(!URL_)return toast('Холболт тохируулаагүй');
 if(BUSY){toast('Өмнөх үйлдэл дуусаагүй байна, түр хүлээнэ үү...');return false}
 BUSY=true;const bt=[...document.querySelectorAll('dialog[open] .btn')];bt.forEach(b=>b.disabled=true);let i=0;busyOn('Хадгалж байна...',A.length);
 try{for(const d of A){const j=await call('act',d);if(!j.ok&&!(d.act=='del'&&/Мөр олдсонгүй/.test(j.error||''))){const er=new Error(j.error||'?');er.srv=1;throw er}busyUp('Хадгалж байна...',++i,A.length)}}
 catch(e){BUSY=false;bt.forEach(b=>b.disabled=false);busyOff();alert('Алдаа: '+e.message+(e.srv?'':' (Холболт эсвэл Apps Script-ийн Deploy-г шалгана уу)'));await load();return false}
 busyUp('Мэдээллийг шинэчилж байна...',0,0);try{await load()}finally{BUSY=false;bt.forEach(b=>b.disabled=false);busyOff()}toast('Хадгаллаа ✅');return true}
