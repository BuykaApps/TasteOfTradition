body{font:14px/1.5 Inter,system-ui,"Segoe UI",Roboto,sans-serif;letter-spacing:.005em;background:radial-gradient(900px 500px at 78% -8%,color-mix(in srgb,var(--a) 26%,transparent),transparent 70%),radial-gradient(700px 420px at 0 110%,#3b82f626,transparent 70%),var(--bg)}

aside{background:linear-gradient(180deg,#14112a,#0c0a1c 70%);border-right:1px solid var(--b);box-shadow:none}
html:not([data-theme=dark]) aside{background:linear-gradient(180deg,#221d4d,#15112f)}
.brand{border-bottom:0;padding:20px 16px 12px}
.brand span{display:grid;place-items:center;width:40px;height:40px;font-size:21px;border-radius:12px;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 40%,#22d3ee));box-shadow:0 6px 20px var(--glow);filter:none}
.brand b{font-size:15px;font-weight:700}
aside nav{padding:8px 12px}
aside nav button{border-radius:12px;color:#aaa6cc;padding:10px 12px;font-size:13.5px}
aside nav button:hover{background:#ffffff0d;transform:none;color:#fff}aside nav button:hover .ic{transform:none}
aside nav button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 34%,transparent),color-mix(in srgb,var(--a) 12%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 50%,transparent),0 6px 20px color-mix(in srgb,var(--a) 22%,transparent)}
aside nav button.on::before{display:none}
.ngh{font-size:11px;color:#7f7aa6}.sfoot{border-top:1px solid #ffffff12}
.top{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:12px 26px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.btn,.top button{border-radius:12px;background:var(--c);border:1px solid var(--b);padding:8px 14px}
.btn:hover,.top button:hover{box-shadow:0 6px 18px var(--glow);border-color:color-mix(in srgb,var(--a) 60%,transparent);transform:none}
#kb{min-width:min(34vw,300px);text-align:left;color:var(--m);border-radius:14px}#kb .kbd{float:right}
.btn.pri,#fab .fb{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#3b82f6));border:0;color:#fff;box-shadow:0 8px 22px var(--glow)}
main{max-width:1400px;padding:22px 26px 50px}
.card{border-radius:var(--r2);padding:18px;background:linear-gradient(180deg,#ffffff0a,#ffffff03),var(--c);box-shadow:var(--sh)}
html:not([data-theme=dark]) .card{background:var(--c)}
.card:hover{transform:none;border-color:color-mix(in srgb,var(--a) 40%,var(--b))}
.card h3{font-size:11.5px;font-weight:600;letter-spacing:.08em}
.kpis{gap:16px}
.kpi{border-radius:var(--r2);border-top:1px solid var(--b);text-align:left;padding:16px 18px;position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--k,var(--a)) 16%,transparent),transparent 65%),var(--c)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--k,var(--a));opacity:.16;filter:blur(24px)}
.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 34px color-mix(in srgb,var(--k,var(--a)) 24%,transparent)}
.kpi span{font-weight:500;font-size:12px}.kpi b{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--t)}
.dl.up{color:var(--g)}.dl.dn{color:var(--r)}
table{border-collapse:separate;border-spacing:0}
th{background:var(--cd);color:var(--m);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--b)}
td{border-bottom:1px solid #ffffff0b}html:not([data-theme=dark]) td{border-bottom-color:var(--b)}
tbody tr:nth-child(even){background:transparent}tbody tr:hover{background:color-mix(in srgb,var(--a) 10%,transparent)}
.sc{border-radius:14px;border:1px solid var(--b)}
.chip{border-radius:999px;padding:3px 11px}.chip.w{background:#ff6b8120}.chip.y{background:#ffb45420}.chip.ok{background:#3ddc9720}
.bar{height:10px;border-radius:99px;background:#ffffff12;box-shadow:inset 0 1px 3px #0006}
.bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 70%,#22d3ee),var(--a));box-shadow:0 0 14px var(--glow)}
input,select{border-radius:12px;background:color-mix(in srgb,var(--cd) 85%,transparent)}
input:focus,select:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 30%,transparent)}
dialog,#cdlg,#kp,#posd{border-radius:22px;background:var(--cd);box-shadow:0 30px 90px #000a,0 0 0 1px var(--b)}
dialog::backdrop,#cdlg::backdrop,#kp::backdrop,#posd::backdrop{background:#05040dcc;backdrop-filter:blur(8px)}
#kl .ki{border-radius:12px}#kl .ki.on,#kl .ki:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 30%,transparent),transparent)}
.pop,#cdd{border-radius:16px;background:var(--cd)}
#msg{border-radius:999px;background:var(--cd);color:var(--t);border:1px solid var(--b);box-shadow:0 12px 40px #0008}
.pt{border-radius:16px}.pt.on{box-shadow:0 0 0 1px var(--a),0 8px 24px var(--glow)}
.hm div{border-radius:9px}
#lg{background:radial-gradient(700px 400px at 50% 0,color-mix(in srgb,var(--a) 30%,transparent),transparent 70%),var(--bg)}
#lg form{border-radius:24px;box-shadow:0 30px 90px #0009}
#lg .lgb{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 6px;border-radius:18px;background:linear-gradient(135deg,var(--a),#22d3ee);filter:none;box-shadow:0 10px 30px var(--glow)}
@media(max-width:860px){main{padding:14px 14px 96px}.top{padding:10px 14px}.top h1{font-size:18px}#kb{min-width:0}
#bt{left:10px;right:10px;bottom:10px;border-radius:22px;border:1px solid var(--b);box-shadow:0 12px 40px #000a}}

/* ===== v3 structural layer ===== */
:root{--sw:240px}body.col{--sw:78px}
.top{gap:12px}.top h1{display:none}
#kb{flex:0 1 460px;min-width:0;padding:10px 16px;border-radius:14px;background:var(--c)}
#rl{font-size:12px;padding:8px 12px}
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 20px}.phead>div:first-child{flex:1;min-width:220px}
.phead h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.phead p{margin:6px 0 0;color:var(--m);font-size:13.5px}#pact{display:flex;gap:8px}#pact select{width:auto;border-radius:12px;min-width:112px;padding-top:8px;padding-bottom:8px}
.card.tool{background:transparent;border:0;box-shadow:none;padding:0 0 14px;backdrop-filter:none}.card.tool:hover{border:0}
/* icon rail */
aside{width:var(--sw);align-items:stretch}
body.col .brand{justify-content:center;padding:18px 0 10px}
body.col aside nav{overflow:visible;padding:8px 14px;gap:4px;align-items:stretch}
body.col aside nav button{overflow:visible;justify-content:center;padding:12px 0;width:100%}
body.col aside nav button .ic{width:20px;height:20px;display:grid;place-items:center}
body.col .ng{border-top:1px solid #ffffff12;margin-top:8px;padding-top:8px}
body.col aside nav button:hover::after{content:attr(title);position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);background:var(--cd);color:var(--t);border:1px solid var(--b);padding:6px 11px;border-radius:10px;white-space:nowrap;font-size:12px;font-weight:500;z-index:60;box-shadow:0 10px 30px #0008;pointer-events:none}
body.col .sfoot{justify-content:center;padding:12px 0}
aside nav button .ic svg{display:block}
/* create menu as dropdown */
@media(min-width:861px){#fab{top:64px;bottom:auto;right:26px}#fab .fb{display:none}#fab .fm{background:var(--cd);border:1px solid var(--b);border-radius:16px;padding:8px;box-shadow:0 24px 60px #000a;min-width:240px;align-items:stretch}#fab .fm button{border:0;background:none;box-shadow:none;border-radius:10px;text-align:left;animation:none}#fab .fm button:hover{background:color-mix(in srgb,var(--a) 18%,transparent);transform:none}}
@media(max-width:860px){#cr{display:none}}
body.ro #cr{display:none}
/* stat strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--b);border-radius:20px;background:linear-gradient(180deg,#ffffff0a,#ffffff03),var(--c);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.sc4{padding:18px 20px 12px;cursor:pointer;position:relative;border-right:1px solid var(--b);transition:background .2s}.sc4:last-child{border:0}.sc4:hover{background:color-mix(in srgb,var(--k) 9%,transparent)}
.sc4 span{display:flex;align-items:center;gap:8px;color:var(--m);font-size:12px;font-weight:500}.sc4 span i{width:8px;height:8px;border-radius:50%;background:var(--k);box-shadow:0 0 10px var(--k)}
.sc4 b{display:block;font-size:30px;font-weight:700;letter-spacing:-.025em;margin:8px 0 2px}.sc4 .spk{height:30px;margin-top:8px}
.minis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.mini{flex:1;min-width:150px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--b);border-radius:14px;background:var(--c);cursor:pointer;transition:border-color .2s}.mini:hover{border-color:var(--a)}.mini span{color:var(--m);font-size:12px}.mini b{font-size:15px}
.warnb{border:1px solid #ffb45455;background:#ffb4540f;color:var(--y);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}.ch h3{margin:0 0 4px;font-size:15px;color:var(--t);text-transform:none;letter-spacing:0;font-weight:600}.ch .sub{margin:0}
/* shelf / tubes */
.tubes{display:flex;gap:14px;flex-wrap:wrap}.tg{padding:14px 16px 10px;border-radius:18px;border:1px solid var(--b);background:linear-gradient(180deg,#ffffff0a,transparent)}.tr{display:flex;gap:8px}
.tb{width:52px;text-align:center;cursor:pointer;transition:transform .2s}.tb:hover{transform:translateY(-4px)}
.tube{position:relative;width:28px;height:130px;margin:0 auto;border-radius:16px;overflow:hidden;background:#ffffff0c;border:1px solid var(--b);box-shadow:inset 0 2px 8px #0006}
html:not([data-theme=dark]) .tube{background:#6a5fc012}
.tube i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#b3a9ff,var(--a));box-shadow:0 0 20px var(--glow);animation:rise .9s ease both}@keyframes rise{from{height:0!important}}
.tb.mid .tube i{background:linear-gradient(180deg,#ffd9a0,#ffb454);box-shadow:0 0 20px #ffb45466}.tb.low .tube i{background:linear-gradient(180deg,#ffa3b4,#ff5d7a);box-shadow:0 0 20px #ff5d7a66}
.tube u{position:absolute;left:0;right:0;height:2px;background:#fffc;box-shadow:0 0 6px #fff}
.tb small{display:block;margin-top:7px;font-size:11px;font-weight:600}.tb em{display:block;font-style:normal;font-size:9.5px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{text-align:center;margin-top:10px;font-size:10.5px;letter-spacing:.14em;color:var(--m);text-transform:uppercase}
.lgd{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--m)}.lgd i{width:9px;height:9px;border-radius:3px;margin-left:10px}.lgd i.a{background:var(--a)}.lgd i.y{background:#ffb454}.lgd i.r{background:#ff5d7a}
/* pills & table rows */
.pills{display:flex;gap:6px;padding:4px;border-radius:14px;background:#ffffff0a;border:1px solid var(--b)}.pill{border:0;background:none;color:var(--m);padding:6px 12px;border-radius:10px;cursor:pointer;font:inherit;font-size:12.5px}.pill b{margin-left:4px;opacity:.7}.pill.on{background:color-mix(in srgb,var(--a) 28%,transparent);color:var(--t)}
.it{display:flex;align-items:center;gap:12px}.it i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:14px;box-shadow:0 6px 16px #0005}.it b{display:block}.it small{color:var(--m);font-size:11.5px}
.ls{display:flex;align-items:center;gap:10px;min-width:150px}.ls .bar{flex:1;height:6px}.ls span{font-size:12px;color:var(--m);min-width:46px}
.btn.rs{padding:6px 12px;font-size:12.5px;border-radius:10px}
td{padding-top:12px;padding-bottom:12px}
@media(max-width:1100px){.strip{grid-template-columns:repeat(2,1fr)}.sc4:nth-child(2){border-right:0}.sc4:nth-child(-n+2){border-bottom:1px solid var(--b)}}
@media(max-width:860px){#rl{font-size:0;padding:8px 12px}#rl::before{content:"↻";font-size:16px}.phead h1{font-size:24px}.strip{grid-template-columns:1fr 1fr}.sc4 b{font-size:22px}.tb{width:46px}}

/* ===== v4 ===== */
.strip{grid-template-columns:repeat(var(--n,4),1fr)}
@media(max-width:1100px){.strip{grid-template-columns:repeat(2,1fr)}}
.gs .tube i{animation:none}
.seg{display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--b);background:#ffffff0a}.seg button{border:0!important;background:none!important;box-shadow:none!important;color:var(--m);padding:6px 12px!important;border-radius:9px!important;cursor:pointer;font:inherit;font-size:12.5px}.seg button.on{background:color-mix(in srgb,var(--a) 28%,transparent)!important;color:var(--t)}
.dch{display:flex;gap:6px;flex-wrap:wrap;padding:4px}.dch .btn{border:0;background:transparent;border-radius:10px;padding:7px 12px}.dch .btn.pri{background:color-mix(in srgb,var(--a) 28%,transparent);color:var(--t);box-shadow:none}.dch small{opacity:.6;margin-left:6px}
#p-docs>.card:first-of-type{padding:6px;display:inline-block}#p-docs .dt{display:none}
.tl2{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:14px;box-shadow:0 6px 16px #0005;flex:none}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{border:1px solid var(--b);border-radius:20px;background:linear-gradient(180deg,#ffffff08,#ffffff02);padding:12px;transition:border-color .2s,background .2s}.kcol.over{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent);box-shadow:0 0 0 1px var(--a),0 12px 40px var(--glow)}
.colh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px;font-weight:600}.colh span{display:flex;align-items:center;gap:8px}.colh i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}.colh b{font-size:12px;color:var(--m);background:#ffffff10;padding:2px 9px;border-radius:99px}
.colb{display:flex;flex-direction:column;gap:10px;min-height:60px}.emp{text-align:center;padding:14px 0;margin:0}
.kc{border:1px solid var(--b);border-radius:16px;padding:12px 13px;background:var(--cd);cursor:pointer;transition:transform .18s,box-shadow .2s,border-color .2s}.kc[draggable=true]{cursor:grab}.kc:hover{border-color:color-mix(in srgb,var(--a) 55%,transparent);box-shadow:0 10px 30px var(--glow);transform:translateY(-2px)}
.kc.drag{opacity:.35;transform:scale(.97)}
.kh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px}.kn{display:flex;align-items:center;gap:7px;font-weight:700}.kn i{width:7px;height:7px;border-radius:50%}.kn em{font-style:normal;font-weight:500;color:var(--m)}
.kpp{display:flex;align-items:center;gap:10px}.kpp b{display:block;font-size:13.5px}.kpp small{color:var(--m);font-size:11.5px}.kpp .tl2{width:30px;height:30px;font-size:12px;border-radius:10px}
.kit{margin:10px 0 2px;font-size:12px;color:var(--m);line-height:1.5}.kit b{color:var(--t)}
.kf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--b);font-size:12px;color:var(--m)}.kf b{color:var(--t);font-size:13px}
/* level bar */
.lv{position:relative;height:8px;border-radius:99px;background:#ffffff12;box-shadow:inset 0 1px 3px #0006;margin:10px 0 2px;overflow:visible}.lv i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8e82ff,var(--a));box-shadow:0 0 12px var(--glow)}.lv.y i{background:linear-gradient(90deg,#ffd9a0,#ffb454);box-shadow:0 0 12px #ffb45466}.lv.r i{background:linear-gradient(90deg,#ffa3b4,#ff5d7a);box-shadow:0 0 12px #ff5d7a66}.lv u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fffd;border-radius:2px}
td.up{color:var(--g)}td.dn{color:var(--r)}.bm table{table-layout:auto!important;width:100%!important}.bm td,.bm th{overflow:visible!important}
/* product + recipe cards */
.pgrp .gh{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.gh i{width:9px;height:9px;border-radius:50%}.gh small{opacity:.6}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pc{border:1px solid var(--b);border-radius:18px;padding:14px;background:linear-gradient(180deg,#ffffff0a,#ffffff03),var(--c);transition:transform .2s,box-shadow .2s,border-color .2s}.pc:hover{transform:translateY(-3px);border-color:var(--a);box-shadow:0 12px 34px var(--glow)}
.pcT{display:flex;justify-content:space-between;margin-bottom:12px}.pc b{display:block}.pr{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.02em}.acts{opacity:0;transition:.2s;display:inline-flex;gap:8px}.pc:hover .acts,.ri:hover .acts{opacity:1}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-bottom:14px}.rc{margin:0}
.rh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.rh b{display:block;font-size:15px}.rh small{color:var(--m);font-size:12px}.rcost{margin-left:auto;text-align:right;font-weight:700;font-size:15px}.rcost small{display:block;font-weight:400}
.ri{display:grid;grid-template-columns:110px 1fr 84px 44px;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-top:1px solid #ffffff0a}.ri u{text-decoration:none;text-align:right;color:var(--m)}.ri .bar{height:6px}
/* undo toast & palette */
#msg{align-items:center;gap:14px}#msg .undo{background:var(--a);color:#fff;border:0;border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
.kg{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--m);padding:12px 12px 4px}.kfoot{display:flex;gap:16px;padding:10px 12px 2px;margin-top:8px;border-top:1px solid var(--b);font-size:11.5px;color:var(--m)}.kfoot kbd{border:1px solid var(--b);border-radius:6px;padding:1px 6px;margin-right:4px;background:#ffffff0a;font:inherit}
#p-bm .tool input,#p-bm .tool label{font-size:13px}
@media(max-width:860px){.board{grid-auto-columns:82%}.ri{grid-template-columns:90px 1fr 74px 0}.ri .acts{display:none}}

/* fix: тавиур хойшоо үргэлжлэхгүй, хуудас хэвтээ гүйхгүй */
html,body{overflow-x:hidden;max-width:100%}
.wrap,main,.card,.shelf{min-width:0;max-width:100%}
.tubes{min-width:0}.tubes>.tg{max-width:100%;min-width:0}
.tr{flex-wrap:wrap;row-gap:12px;justify-content:flex-start}
.shelf{overflow:hidden}
#fab .fm{max-width:calc(100vw - 20px)}
#src{display:block;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* метрик картууд: хөдөлгөөнт */
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.mc{position:relative;overflow:hidden;padding:13px 14px 10px;border:1px solid var(--b);border-radius:var(--r2,16px);cursor:pointer;background:linear-gradient(160deg,color-mix(in srgb,var(--k) 14%,transparent),transparent 62%),var(--c);transition:transform .2s,box-shadow .25s;animation:mcin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.mc::after{content:"";position:absolute;right:-26px;top:-26px;width:84px;height:84px;border-radius:50%;background:var(--k);opacity:.18;filter:blur(22px);animation:mcf 6s ease-in-out infinite alternate;pointer-events:none}
.mc:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--k) 26%,transparent)}
.mc:active{transform:scale(.98)}
.ml{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.3px;color:var(--m);font-weight:600;text-transform:uppercase;line-height:1.25}
.ml i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--k);animation:mcp 2.4s infinite}
.mv{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.mv b{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--t);font-variant-numeric:tabular-nums}
.rg{flex:none;width:44px;height:44px;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:5;stroke-linecap:round}
.rg .t{stroke:color-mix(in srgb,var(--k) 18%,transparent)}
.rg .a{stroke:var(--k);animation:mcr 1.1s cubic-bezier(.2,.8,.2,1) both .2s}
