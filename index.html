<!DOCTYPE html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><title>Mozart Bakery — Түүхий эдийн систем</title>
<style>
:root{--bg:#e9eff5;--c:rgba(255,255,255,.74);--cd:rgba(255,255,255,.9);--t:#17232d;--m:#64748b;--b:rgba(15,42,67,.1);--a:#1f6f8b;--p:#0f2a43;--r:#c0392b;--y:#d68910;--g:#1e8449;--sh:0 1px 2px #0b1f3012,0 8px 24px #0b1f3012;--sw:250px}
html[data-theme=dark]{--bg:#091017;--c:rgba(24,36,47,.62);--cd:rgba(18,28,37,.92);--t:#e6edf1;--m:#8fa1ad;--b:rgba(255,255,255,.09);--p:#0a1c2d;--sh:0 1px 2px #0006,0 8px 28px #0005}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:14px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);min-height:100vh;transition:background .3s}
body.col{--sw:74px}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}body.noaur .aurora{display:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;animation:fl 20s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-12vw;background:var(--a)}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:10vh;background:#7a5cf0;animation-duration:26s}
.aurora i:nth-child(3){width:42vw;height:42vw;left:30vw;bottom:-18vw;background:#1ec3a5;animation-duration:30s}
html[data-theme=dark] .aurora i{opacity:.28}
@keyframes fl{to{transform:translate(6vw,5vh) scale(1.18)}}
aside{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:linear-gradient(180deg,#0c2338e6,#0a1826f2);backdrop-filter:blur(18px);color:#fff;display:flex;flex-direction:column;z-index:20;transition:width .25s,transform .25s;box-shadow:4px 0 28px #0004}
.brand{display:flex;gap:11px;align-items:center;padding:18px 16px;border-bottom:1px solid #ffffff18;overflow:hidden;white-space:nowrap}
.brand span{font-size:26px;filter:drop-shadow(0 0 8px var(--a))}.brand b{display:block;font-size:14px;letter-spacing:.3px}.brand small{opacity:.65;font-size:11px}
aside nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#cfe0ec;padding:11px 13px;border-radius:11px;cursor:pointer;font:inherit;text-align:left;white-space:nowrap;position:relative;overflow:hidden;transition:background .18s,transform .18s,color .18s}
aside nav button .ic{font-size:18px;width:22px;text-align:center;flex:none;transition:transform .2s}
aside nav button:hover{background:#ffffff1a;color:#fff;transform:translateX(4px)}aside nav button:hover .ic{transform:scale(1.2) rotate(-6deg)}
aside nav button.on{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 75%,transparent),#ffffff10);color:#fff;font-weight:600;box-shadow:0 4px 16px color-mix(in srgb,var(--a) 45%,transparent)}
aside nav button.on::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:4px;border-radius:0 4px 4px 0;background:#fff}
body.col aside nav button .lb,body.col .brand div,body.col #src{display:none}body.col aside nav button:hover{transform:none}
.sfoot{padding:12px 14px;border-top:1px solid #ffffff18;display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12px;color:#b8cddd}
#colb{background:#ffffff1a;border:0;color:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;transition:.2s}#colb:hover{background:#ffffff33;transform:scale(1.1)}
.wrap{margin-left:var(--sw);transition:margin .25s;min-height:100vh}
.top{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:12px 22px;background:var(--c);backdrop-filter:blur(16px);border-bottom:1px solid var(--b)}
.top h1{margin:0;font-size:18px}.top h1 small{color:var(--m);font-weight:400;font-size:12px;margin-left:8px}.sp{flex:1}#burger{display:none}
.btn,.top button{border:1px solid var(--b);background:var(--cd);color:var(--t);padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover,.top button:hover{transform:translateY(-1px);box-shadow:0 6px 16px #0b1f3026;border-color:var(--a)}.btn:active,.top button:active{transform:scale(.96)}
.btn.pri{background:var(--a);color:#fff;border-color:var(--a)}
.rp{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rp .55s linear;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
main{padding:18px 22px 40px;max-width:1320px;margin:auto}
section{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--c);backdrop-filter:blur(14px);border:1px solid var(--b);border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s}
